# GPX Viewer — Docker Compose
#
#   cp .env.example .env   # optional: set HOST (default 0.0.0.0) and PORT (default 8080)
#   docker compose up -d --build
#
# The container always listens on port 3000 (Bun's default); only the host
# side is configurable via HOST and PORT in .env.

services:
  gpx-viewer:
    build:
      context: .
      dockerfile: Dockerfile
    image: gpx-viewer
    restart: unless-stopped
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-8080}:3000"
    environment:
      NODE_ENV: production
