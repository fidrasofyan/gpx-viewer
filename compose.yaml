# GPX Viewer — Docker Compose
#
#   cp .env.example .env   # required: sets HOST and PORT
#   docker compose up -d --build
#
# Caddy serves the static bundle on port 80 inside the container; the host side
# is configured via HOST and PORT, both required from .env (see .env.example).

services:
  gpx-viewer:
    container_name: gpx-viewer
    build:
      context: .
      dockerfile: Dockerfile
    image: gpx-viewer
    restart: unless-stopped
    ports:
      - "${HOST:?HOST is required — copy .env.example to .env}:${PORT:?PORT is required — copy .env.example to .env}:80"
